version: '3.8'

services:
  wunderground-api:
    build: .
    container_name: wunderground-weather-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - RATE_LIMIT=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Uncomment below if you want to use Redis for caching
    # depends_on:
    #   - redis
    
  # Optional Redis cache (uncomment if needed)
