<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Analysis Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-card-hover: #22222e;
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #5a5a70;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --border: #2a2a3a;
      --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --gradient-cold: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --gradient-accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    header {
      text-align: center;
      padding: 3rem 0;
      position: relative;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      position: relative;
      z-index: 1;
    }

    /* Search Form */
    .search-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .search-form {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .form-group {
      flex: 1;
      min-width: 200px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    button {
      padding: 0.875rem 2rem;
      background: var(--gradient-accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Results */
    .results {
      display: none;
    }

    .results.visible {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .stat-card.highlight {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
      border-color: var(--accent);
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-value.warm {
      background: var(--gradient-warm);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-value.cold {
      background: var(--gradient-cold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-unit {
      font-size: 1.25rem;
      color: var(--text-secondary);
    }

    .stat-detail {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    /* Insights */
    .insights-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .insight-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem;
      background: var(--bg-secondary);
      border-radius: 10px;
      margin-bottom: 0.75rem;
    }

    .insight-icon {
      width: 32px;
      height: 32px;
      background: var(--gradient-accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .insight-text {
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* Time Patterns */
    .patterns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .pattern-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .pattern-title {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .time-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .time-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-radius: 8px;
    }

    .time-label {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
    }

    .time-temp {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    /* Daily Chart */
    .chart-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      overflow-x: auto;
    }

    .chart-container {
      min-width: 600px;
      height: 200px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding-top: 2rem;
      position: relative;
    }

    .chart-bar {
      flex: 1;
      min-width: 20px;
      background: var(--gradient-accent);
      border-radius: 4px 4px 0 0;
      position: relative;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .chart-bar:hover {
      opacity: 0.8;
    }

    .chart-bar .tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .chart-bar:hover .tooltip {
      opacity: 1;
    }

    /* Location Header */
    .location-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .location-name {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .location-details {
      color: var(--text-secondary);
    }

    .period-badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border-radius: 20px;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Error State */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      border-radius: 12px;
      padding: 1.5rem;
      color: var(--error);
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .search-form {
        flex-direction: column;
      }

      .form-group {
        width: 100%;
      }

      button {
        width: 100%;
        justify-content: center;
      }

      .stat-value {
        font-size: 2rem;
      }
    }

    /* Examples */
    .examples {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .examples-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .example-chips {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .example-chip {
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.875rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .example-chip:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* Data Table */
    .table-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    .data-table thead {
      background: var(--bg-secondary);
    }

    .data-table th {
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
    }

    .data-table td {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    .data-table tbody tr:hover {
      background: var(--bg-card-hover);
    }

    .data-table .temp-high {
      color: #f59e0b;
      font-weight: 600;
    }

    .data-table .temp-low {
      color: #3b82f6;
    }

    .data-table .temp-avg {
      color: var(--text-secondary);
    }

    .data-table .date-cell {
      font-weight: 500;
    }

    .median-row {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%) !important;
      font-weight: 700;
    }

    .median-row td {
      border-top: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      color: var(--accent);
    }

    .table-summary {
      display: flex;
      gap: 2rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .summary-label {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .summary-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Distribution bar */
    .distribution-bar-container {
      width: 100%;
      height: 20px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
    }

    .distribution-bar {
      height: 100%;
      background: var(--gradient-accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .distribution-table td:last-child {
      width: 40%;
      min-width: 150px;
    }

    .time-cell {
      color: var(--text-secondary);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* Time Distribution Section */
    .time-distribution-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .section-subtitle {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .distribution-charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 2rem;
    }

    .distribution-chart {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .chart-summary {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .summary-badge {
      background: var(--bg-card);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .summary-badge.hot {
      background: rgba(255, 107, 53, 0.15);
      border-color: rgba(255, 107, 53, 0.3);
      color: var(--orange);
    }

    .summary-badge.cold {
      background: rgba(99, 179, 237, 0.15);
      border-color: rgba(99, 179, 237, 0.3);
      color: var(--blue);
    }

    .time-bars {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .time-bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .time-bar-row.has-data {
      opacity: 1;
    }

    .time-label {
      min-width: 55px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }

    .time-bar-container {
      flex: 1;
      height: 24px;
      background: var(--bg-card);
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .time-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
      min-width: 2px;
    }

    .bar-hot {
      background: linear-gradient(90deg, var(--orange), #ff8a50);
    }

    .bar-cold {
      background: linear-gradient(90deg, var(--blue), #90cdf4);
    }

    .bar-count {
      position: absolute;
      right: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .time-bar-row.has-data:hover {
      transform: translateX(2px);
    }

    .time-bar-row.has-data:hover .time-bar {
      filter: brightness(1.1);
    }

    @media (max-width: 900px) {
      .distribution-charts {
        grid-template-columns: 1fr;
      }
    }

    /* Peak Persistence Section */
    .persistence-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .persistence-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .persistence-stat {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }

    .persistence-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--orange);
      font-family: 'JetBrains Mono', monospace;
    }

    .persistence-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    .persistence-bars {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .persistence-bar-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .persistence-date {
      min-width: 80px;
      text-align: right;
    }

    .date-main {
      display: block;
      font-size: 0.9rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .date-day {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .persistence-bar-wrapper {
      flex: 1;
      height: 32px;
      background: var(--bg-secondary);
      border-radius: 6px;
      overflow: hidden;
    }

    .persistence-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), #ffaa50);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      min-width: fit-content;
      transition: width 0.4s ease;
    }

    .persistence-bar-label {
      font-size: 0.8rem;
      color: #1a1a2e;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Persistence Table */
    .persistence-table {
      margin-top: 1.5rem;
    }

    .persistence-table .date-main {
      display: block;
      font-weight: 500;
    }

    .persistence-table .date-day {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .persistence-table .duration-note {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: normal;
    }

    .persistence-table .highlight-row {
      background: rgba(255, 107, 53, 0.1);
    }

    .persistence-table .highlight-row td {
      color: var(--orange);
    }

    .persistence-table tfoot tr {
      background: var(--bg-secondary);
      font-size: 0.9rem;
    }

    .persistence-table tfoot td {
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather Analysis Dashboard</h1>
      <p class="subtitle">30-day temperature patterns & insights from Wunderground</p>
    </header>

    <section class="search-section">
      <form class="search-form" id="searchForm">
        <div class="form-group">
          <label for="location">Location (Station Code)</label>
          <input 
            type="text" 
            id="location" 
            name="location" 
            placeholder="kr/incheon/RKSI"
            required
          >
        </div>
        <div class="form-group" style="max-width: 150px;">
          <label for="days">Days to Analyze</label>
          <select id="days" name="days">
            <option value="7">7 days</option>
            <option value="14">14 days</option>
            <option value="30" selected>30 days</option>
            <option value="45">45 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
          </select>
        </div>
        <button type="submit" id="submitBtn">
          <span id="btnText">Analyze</span>
          <div class="spinner" id="spinner" style="display: none;"></div>
        </button>
      </form>
      
      <div class="examples">
        <div class="examples-title">Try these examples:</div>
        <div class="example-chips">
          <span class="example-chip" data-location="kr/incheon/RKSI">Seoul (RKSI)</span>
          <span class="example-chip" data-location="us/new-york-city/KLGA">New York LGA (KLGA)</span>
          <span class="example-chip" data-location="gb/london/EGLC">London City (EGLC)</span>
          <span class="example-chip" data-location="ca/mississauga/CYYZ">Toronto (CYYZ)</span>
          <span class="example-chip" data-location="us/dallas/KDAL">Dallas (KDAL)</span>
          <span class="example-chip" data-location="us/atlanta/KATL">Atlanta (KATL)</span>
          <span class="example-chip" data-location="us/seatac/KSEA">Seattle (KSEA)</span>
        </div>
      </div>
    </section>

    <div id="errorContainer"></div>
    
    <div class="results" id="results">
      <!-- Results will be rendered here -->
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const results = document.getElementById('results');
    const errorContainer = document.getElementById('errorContainer');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const locationInput = document.getElementById('location');
    
    // Example chips
    document.querySelectorAll('.example-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        locationInput.value = chip.dataset.location;
        form.dispatchEvent(new Event('submit'));
      });
    });

    // Helper function to convert Celsius to Fahrenheit
    function celsiusToFahrenheit(c) {
      if (c === null || c === undefined || isNaN(c)) return null;
      return Math.round((c * 9/5 + 32) * 10) / 10;
    }

    // Helper function to format temperature with both C and F
    function formatTemp(c) {
      if (c === null || c === undefined || isNaN(c)) return 'N/A';
      const f = celsiusToFahrenheit(c);
      return `${c}°C (${f}°F)`;
    }

    // Helper function to format temperature range
    function formatTempRange(min, max) {
      if (min === null || max === null) return 'N/A';
      return `${min}°C (${celsiusToFahrenheit(min)}°F) to ${max}°C (${celsiusToFahrenheit(max)}°F)`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const location = document.getElementById('location').value;
      const days = document.getElementById('days').value;
      
      // Show loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Analyzing...';
      spinner.style.display = 'block';
      errorContainer.innerHTML = '';
      results.classList.remove('visible');
      
      try {
        const response = await fetch(`/api/analysis/temperature?location=${encodeURIComponent(location)}&days=${days}`);
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error?.message || 'Analysis failed');
        }
        
        renderResults(data.data);
        results.classList.add('visible');
        
      } catch (error) {
        errorContainer.innerHTML = `
          <div class="error-message">
            <strong>Error:</strong> ${error.message}
          </div>
        `;
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Analyze';
        spinner.style.display = 'none';
      }
    });

    function renderResults(data) {
      const { location, period, temperature, patterns, insights, daily_breakdown } = data;
      
      results.innerHTML = `
        <div class="location-header">
          <div class="location-name">${location.city}, ${location.country}</div>
          <div class="location-details">Station: ${location.station}</div>
          <div class="period-badge">
            ${period.start_date} → ${period.end_date} (${period.days_with_data} days of data)
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card highlight">
            <div class="stat-label">📊 Median Daily High</div>
            <div class="stat-value warm">${formatTemp(temperature.daily_highs.median)}</div>
            <div class="stat-detail">Range: ${formatTempRange(temperature.daily_highs.min, temperature.daily_highs.max)}</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">🌡️ Overall Average</div>
            <div class="stat-value">${formatTemp(temperature.overall_average)}</div>
            <div class="stat-detail">${period.total_observations} observations</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">🔥 Absolute Maximum</div>
            <div class="stat-value warm">${formatTemp(temperature.absolute_max)}</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">❄️ Absolute Minimum</div>
            <div class="stat-value cold">${formatTemp(temperature.absolute_min)}</div>
          </div>
          
          <div class="stat-card highlight">
            <div class="stat-label">☀️ Peak Temperature Time (Median)</div>
            <div class="stat-value">${patterns.hottest_time_of_day.median_time}</div>
            <div class="stat-detail">Most common: ${patterns.hottest_time_of_day.most_common_time} (${patterns.hottest_time_of_day.frequency}/${period.days_with_data} days)</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">🌙 Coldest Time of Day (Median)</div>
            <div class="stat-value">${patterns.coldest_time_of_day.median_time}</div>
            <div class="stat-detail">Most common: ${patterns.coldest_time_of_day.most_common_time} (${patterns.coldest_time_of_day.frequency}/${period.days_with_data} days)</div>
          </div>
          
          <div class="stat-card">
            <div class="stat-label">⏱️ Peak Temp Persistence</div>
            <div class="stat-value">${patterns.peak_persistence?.average_duration_estimate || 'N/A'}</div>
            <div class="stat-detail">Avg ${patterns.peak_persistence?.average_longest_streak || 0} consecutive readings at daily high</div>
          </div>
        </div>

        <section class="insights-section">
          <h2 class="section-title">💡 Key Insights</h2>
          ${insights.map(insight => `
            <div class="insight-item">
              <div class="insight-icon">✨</div>
              <div class="insight-text">${insight}</div>
            </div>
          `).join('')}
        </section>

        <section class="time-distribution-section">
          <h2 class="section-title">🕐 When Do Temperature Extremes Occur?</h2>
          <p class="section-subtitle">Distribution of daily high and low temperature times across the analyzed period</p>
          
          <div class="distribution-charts">
            <div class="distribution-chart">
              <h3 class="chart-title">☀️ Peak Temperature Times</h3>
              <div class="chart-summary">
                <span class="summary-badge hot">Median: ${patterns.hottest_time_of_day.median_time}</span>
                <span class="summary-badge">Most likely: ${patterns.hottest_time_of_day.most_common_time}</span>
              </div>
              ${renderTimeDistribution(patterns.hottest_time_of_day.hourly_distribution, 'hot')}
            </div>
            
            <div class="distribution-chart">
              <h3 class="chart-title">🌙 Lowest Temperature Times</h3>
              <div class="chart-summary">
                <span class="summary-badge cold">Median: ${patterns.coldest_time_of_day.median_time}</span>
                <span class="summary-badge">Most likely: ${patterns.coldest_time_of_day.most_common_time}</span>
              </div>
              ${renderTimeDistribution(patterns.coldest_time_of_day.hourly_distribution, 'cold')}
            </div>
          </div>
        </section>

        ${patterns.peak_persistence ? `
        <section class="persistence-section">
          <h2 class="section-title">⏱️ Peak Temperature Persistence</h2>
          <p class="section-subtitle">How long does the daily high temperature hold before dropping?</p>
          
          <div class="persistence-stats">
            <div class="persistence-stat">
              <div class="persistence-value">${patterns.peak_persistence.average_duration_estimate}</div>
              <div class="persistence-label">Average Duration</div>
            </div>
            <div class="persistence-stat">
              <div class="persistence-value">${patterns.peak_persistence.average_longest_streak}</div>
              <div class="persistence-label">Avg Consecutive Readings</div>
            </div>
            <div class="persistence-stat">
              <div class="persistence-value">${patterns.peak_persistence.max_streak_observed}</div>
              <div class="persistence-label">Max Streak Observed</div>
            </div>
            <div class="persistence-stat">
              <div class="persistence-value">${patterns.peak_persistence.average_readings_at_peak}</div>
              <div class="persistence-label">Avg Total Readings at Peak</div>
            </div>
          </div>
          
          <table class="data-table persistence-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Peak Temp (°C / °F)</th>
                <th>Total Readings</th>
                <th>Longest Streak</th>
              </tr>
            </thead>
            <tbody>
              ${renderPersistenceTable(patterns.peak_persistence.daily_breakdown)}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="2"><strong>Average</strong></td>
                <td>${patterns.peak_persistence.average_readings_at_peak} readings</td>
                <td><strong>${patterns.peak_persistence.average_longest_streak} consecutive</strong> (${patterns.peak_persistence.average_duration_estimate})</td>
              </tr>
            </tfoot>
          </table>
        </section>
        ` : ''}

        <div class="patterns-grid">
          <div class="pattern-card">
            <div class="pattern-title">🔥 Warmest Hours (Averages)</div>
            <div class="time-list">
              ${patterns.warmest_hours.map((h, i) => `
                <div class="time-item">
                  <span class="time-label">${i + 1}. ${h.time}</span>
                  <span class="time-temp warm">${formatTemp(h.avg_temp)}</span>
                </div>
              `).join('')}
            </div>
          </div>
          
          <div class="pattern-card">
            <div class="pattern-title">❄️ Coldest Hours (Averages)</div>
            <div class="time-list">
              ${patterns.coldest_hours.map((h, i) => `
                <div class="time-item">
                  <span class="time-label">${i + 1}. ${h.time}</span>
                  <span class="time-temp cold">${formatTemp(h.avg_temp)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <section class="chart-section">
          <h2 class="section-title">📈 Daily High Temperatures</h2>
          <div class="chart-container">
            ${renderChart(daily_breakdown)}
          </div>
        </section>

        <section class="table-section">
          <h2 class="section-title">📊 Daily High Temperature Distribution</h2>
          <p style="color: var(--text-secondary); margin-bottom: 1rem;">Frequency of each recorded daily maximum temperature</p>
          <table class="data-table distribution-table">
            <thead>
              <tr>
                <th>Temperature (°C / °F)</th>
                <th>Days Recorded</th>
                <th>Frequency</th>
                <th>Distribution</th>
              </tr>
            </thead>
            <tbody>
              ${renderDistributionTable(data.temperature_distribution, period.days_with_data)}
            </tbody>
          </table>
          <div class="table-summary">
            <div class="summary-item">
              <span class="summary-label">Median High:</span>
              <span class="summary-value temp-high">${formatTemp(temperature.daily_highs.median)}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Most Common:</span>
              <span class="summary-value">${getMostCommonTemp(data.temperature_distribution)}</span>
            </div>
          </div>
        </section>

        <section class="table-section">
          <h2 class="section-title">📋 Daily Temperature Records</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Day</th>
                <th>High (°C / °F)</th>
                <th>Time</th>
                <th>Low (°C / °F)</th>
                <th>Time</th>
                <th>Average (°C / °F)</th>
                <th>Range</th>
              </tr>
            </thead>
            <tbody>
              ${renderDailyTable(daily_breakdown, temperature.daily_highs.median)}
            </tbody>
          </table>
          <div class="table-summary">
            <div class="summary-item">
              <span class="summary-label">Median High:</span>
              <span class="summary-value temp-high">${formatTemp(temperature.daily_highs.median)}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Average High:</span>
              <span class="summary-value">${formatTemp(temperature.daily_highs.average)}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Highest:</span>
              <span class="summary-value temp-high">${formatTemp(temperature.daily_highs.max)}</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Lowest High:</span>
              <span class="summary-value temp-low">${formatTemp(temperature.daily_highs.min)}</span>
            </div>
          </div>
        </section>
      `;
    }

    function renderChart(dailyData) {
      const maxTemp = Math.max(...dailyData.map(d => d.max || 0));
      const minTemp = Math.min(...dailyData.map(d => d.max || 0));
      const range = maxTemp - minTemp || 1;
      
      return dailyData.map(day => {
        const height = ((day.max - minTemp) / range) * 150 + 30;
        const date = new Date(day.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        
        return `
          <div class="chart-bar" style="height: ${height}px;">
            <div class="tooltip">
              <strong>${date}</strong><br>
              High: ${formatTemp(day.max)}<br>
              Low: ${formatTemp(day.min)}<br>
              Avg: ${formatTemp(day.average)}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDailyTable(dailyData, medianHigh) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      return dailyData.map(day => {
        const dateObj = new Date(day.date);
        const dayName = days[dateObj.getDay()];
        const dateFormatted = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const range = day.max - day.min;
        const isMedian = day.max === medianHigh;
        
        return `
          <tr class="${isMedian ? 'median-row' : ''}">
            <td class="date-cell">${dateFormatted}</td>
            <td>${dayName}</td>
            <td class="temp-high">${formatTemp(day.max)} ${isMedian ? '← Median' : ''}</td>
            <td class="time-cell">${day.max_time || '-'}</td>
            <td class="temp-low">${formatTemp(day.min)}</td>
            <td class="time-cell">${day.min_time || '-'}</td>
            <td class="temp-avg">${formatTemp(day.average)}</td>
            <td>${formatTemp(range)}</td>
          </tr>
        `;
      }).join('');
    }

    function renderDistributionTable(distribution, totalDays) {
      if (!distribution || distribution.length === 0) return '<tr><td colspan="4">No data</td></tr>';
      
      const maxCount = Math.max(...distribution.map(d => d.count));
      
      return distribution.map(item => {
        const barWidth = (item.count / maxCount) * 100;
        
        return `
          <tr class="${item.is_median ? 'median-row' : ''}">
            <td class="temp-high">${formatTemp(item.temperature)} ${item.is_median ? '← Median' : ''}</td>
            <td>${item.count} ${item.count === 1 ? 'day' : 'days'}</td>
            <td>${item.percentage}%</td>
            <td>
              <div class="distribution-bar-container">
                <div class="distribution-bar" style="width: ${barWidth}%"></div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function getMostCommonTemp(distribution) {
      if (!distribution || distribution.length === 0) return 'N/A';
      const mostCommon = distribution.reduce((max, item) => item.count > max.count ? item : max);
      return `${formatTemp(mostCommon.temperature)} (${mostCommon.count} days)`;
    }

    function renderTimeDistribution(distribution, type) {
      if (!distribution || distribution.length === 0) {
        return '<div class="no-data">No distribution data available</div>';
      }
      
      const barClass = type === 'hot' ? 'bar-hot' : 'bar-cold';
      
      return `
        <div class="time-bars">
          ${distribution.map(item => `
            <div class="time-bar-row ${item.count > 0 ? 'has-data' : ''}">
              <div class="time-label">${item.label}</div>
              <div class="time-bar-container">
                <div class="time-bar ${barClass}" style="width: ${item.bar_width}%"></div>
                ${item.count > 0 ? `<span class="bar-count">${item.count} day${item.count > 1 ? 's' : ''} (${item.percentage}%)</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderPersistenceTable(dailyData) {
      if (!dailyData || dailyData.length === 0) {
        return '<tr><td colspan="4">No persistence data available</td></tr>';
      }
      
      const maxStreak = Math.max(...dailyData.map(d => d.longest_streak));
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      return dailyData.map(day => {
        const dateObj = new Date(day.date);
        const dayName = days[dateObj.getDay()];
        const dateFormatted = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const durationMins = day.longest_streak * 30; // Assume 30-min intervals
        const isMax = day.longest_streak === maxStreak;
        
        return `
          <tr class="${isMax ? 'highlight-row' : ''}">
            <td>
              <span class="date-main">${dateFormatted}</span>
              <span class="date-day">${dayName}</span>
            </td>
            <td class="temp-high">${formatTemp(day.peak_temp)}</td>
            <td>${day.readings_at_peak} readings</td>
            <td>
              <strong>${day.longest_streak} consecutive</strong>
              <span class="duration-note">(~${durationMins} min)${isMax ? ' 🔥' : ''}</span>
            </td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
